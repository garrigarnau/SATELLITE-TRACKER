# Same routing Vercel did (vercel.json): proxy the N2YO API to avoid CORS,
# and fall back to index.html for client-side routes.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /rest/v1/satellite/ {
        proxy_pass https://api.n2yo.com;
        proxy_set_header Host api.n2yo.com;
        proxy_ssl_server_name on;
    }

    location /geocode/v1/json {
        proxy_pass https://api.opencagedata.com;
        proxy_set_header Host api.opencagedata.com;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri /index.html;
    }
}
